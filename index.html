<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oops... Were you looking for bacon?">
    <meta http-equiv="refresh" content="5;url=https://borneoanthrohub.com/">
    <title>BAHCON</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff7ef;
            color: #333;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            max-width: 600px;
            padding: 40px;
        }

        .bacon {
            font-size: 90px;
        }

        h1 {
            margin: 20px 0;
            font-size: 2.2rem;
        }

        p {
            margin: 10px 0;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        small {
            color: #888;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="bacon">🥓</div>

    <h1>Welcome to BaconCon!</h1>

    <p>
        Wait... this isn't a bacon convention.
    </p>

    <p>
        You were probably looking for
        <strong>BAHCON</strong>, not <strong>Bacon</strong>.
    </p>

    <p>
        Redirecting you to the correct convention...
    </p>

    <small>(Unless you're actually here for bacon.)</small>

</div>

</body>
</html>
